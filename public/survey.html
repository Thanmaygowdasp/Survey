<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Instagram Survey</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      display: flex;
      justify-content: center;
      padding: 30px 10px;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 25px 22px;
      animation: fade 0.4s ease;
    }

    @keyframes fade {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .header p {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    .question {
      margin-bottom: 22px;
      padding: 14px 12px;
      border-radius: 12px;
      background: #f9fbfd;
      border: 1px solid #e6edf5;
      transition: 0.2s;
    }

    .question:hover {
      border-color: #cddff7;
      background: #f3f8ff;
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 13px;
      cursor: pointer;
    }

    .option input {
      accent-color: #4a90e2;
      transform: scale(1.1);
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(74, 144, 226, 0.25);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>

</head>

<body>

  <div class="wrapper">

    <div class="header">

      <h2 id="welcome"></h2>

      <p>
        Please answer all questions honestly.
      </p>

    </div>

    <form id="surveyForm">

      <div id="questions"></div>

      <button type="submit" id="submitButton">
        Submit Survey
      </button>

    </form>

  </div>


  <script>

    // ==============================
    // GET USER DETAILS
    // ==============================

    const name = localStorage.getItem("name");
    const email = localStorage.getItem("email");

    if (!name || !email) {

      alert("Please enter your details first.");

      window.location.href = "/";

    }


    // ==============================
    // WELCOME MESSAGE
    // ==============================

    const welcome = document.getElementById("welcome");

    welcome.innerText = `Welcome User (${email})`;


    // ==============================
    // SURVEY QUESTIONS
    // ==============================

    const questions = [

      {
        q: "How often do you use Instagram?",
        options: [
          "< 1 hour",
          "1–3 hours",
          "3–5 hours",
          "5+ hours"
        ]
      },

      {
        q: "Main purpose of Instagram?",
        options: [
          "Entertainment",
          "Education",
          "Business",
          "Chatting"
        ]
      },

      {
        q: "Does Instagram waste your time?",
        options: [
          "Yes",
          "Sometimes",
          "No"
        ]
      },

      {
        q: "Mental health impact?",
        options: [
          "Positive",
          "Neutral",
          "Negative"
        ]
      },

      {
        q: "Do you feel addicted?",
        options: [
          "Yes",
          "No",
          "Sometimes"
        ]
      },

      {
        q: "Content you see most?",
        options: [
          "Reels",
          "Memes",
          "Education",
          "Influencers"
        ]
      },

      {
        q: "Productivity impact?",
        options: [
          "High negative",
          "Moderate",
          "Low",
          "No effect"
        ]
      },

      {
        q: "Do you compare your life?",
        options: [
          "Often",
          "Sometimes",
          "Never"
        ]
      },

      {
        q: "Overall Instagram effect?",
        options: [
          "Positive",
          "Balanced",
          "Negative"
        ]
      },

      {
        q: "Final opinion?",
        options: [
          "Good platform",
          "Neutral",
          "Bad influence"
        ]
      }

    ];


    // ==============================
    // RENDER QUESTIONS
    // ==============================

    const questionsContainer =
      document.getElementById("questions");

    questions.forEach((question, index) => {

      const questionBox =
        document.createElement("div");

      questionBox.className = "question";

      questionBox.innerHTML = `

        <div class="question-title">
          ${index + 1}. ${question.q}
        </div>

        ${question.options.map(option => `

          <label class="option">

            <input
              type="radio"
              name="q${index}"
              value="${option}"
              required
            >

            ${option}

          </label>

        `).join("")}

      `;

      questionsContainer.appendChild(questionBox);

    });


    // ==============================
    // SUBMIT SURVEY
    // ==============================

    const surveyForm =
      document.getElementById("surveyForm");

    const submitButton =
      document.getElementById("submitButton");


    surveyForm.addEventListener("submit", async (event) => {

      event.preventDefault();


      // Disable button while submitting

      submitButton.disabled = true;

      submitButton.innerText = "Submitting...";


      // ==============================
      // COLLECT ANSWERS
      // ==============================

      const formData =
        new FormData(surveyForm);

      const answers = {};


      formData.forEach((value, key) => {

        answers[key] = value;

      });


      // ==============================
      // SEND DATA TO SERVER
      // ==============================

      try {

        const response = await fetch(
          "/submit-survey",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              name,
              email,
              answers
            })
          }
        );


        const data =
          await response.json();


        // Check server response

        if (!response.ok) {

          throw new Error(
            data.msg || "Server error"
          );

        }


        // ==============================
        // SUCCESS
        // ==============================

        alert(
          `Survey submitted successfully!\n\n` +
          `Your Survey Code: Will Be Sent To Mail`
        );


        // Clear saved details

        localStorage.clear();


        // Return to home page

        window.location.href = "/";

      }


      // ==============================
      // ERROR
      // ==============================

      catch (error) {

        console.error(
          "SUBMIT ERROR:",
          error
        );


        alert(
          "Survey submission failed.\n\n" +
          error.message
        );


        // Enable button again

        submitButton.disabled = false;

        submitButton.innerText =
          "Submit Survey";

      }

    });

  </script>

</body>

</html>
